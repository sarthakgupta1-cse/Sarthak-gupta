# Company career boards checked directly through their public ATS job-board APIs.
# These are the employers' own postings, so they rank above aggregator copies.
# Every slug below returned live jobs when probed on 2026-11-25.
# Add more: find the company's careers page, see which ATS it uses, add the slug.
# A slug that starts returning 404 is logged and skipped. It never breaks the run.

