[project]
name = "remote-job-agent"
version = "1.0.0"
description = "Worldwide remote marketing/content job discovery, verification and application prep"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "PyYAML>=6.0", "python-docx>=1.1", "reportlab>=4.0", "openpyxl>=3.1"]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools]
packages = ["jobagent", "jobagent.sources", "jobagent.applications"]

[tool.pytest.ini_options]
testpaths = ["tests"]
