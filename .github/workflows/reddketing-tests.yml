name: Reddketing tests

on:
  push:
    paths: ["reddketing-lead-engine/**", ".github/workflows/reddketing-*.yml"]
  pull_request:
    paths: ["reddketing-lead-engine/**", ".github/workflows/reddketing-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reddketing-lead-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reddketing-lead-engine/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
