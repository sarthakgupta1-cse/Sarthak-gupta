[project]
name = "reddketing-lead-engine"
version = "1.0.0"
description = "Daily company discovery and lead intelligence for Reddketing (Reddit marketing)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "gspread>=6.0",
    "google-auth>=2.30",
    "requests>=2.31",
    "pydantic>=2.6",
    "tldextract>=5.1",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
oauth = ["google-auth-oauthlib>=1.2"]

[project.scripts]
reddketing = "reddketing.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
